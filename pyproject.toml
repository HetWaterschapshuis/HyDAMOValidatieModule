[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "hydamo_validation"
description = "Validation module for HyDAMO data"
readme = "README.md"
authors = [
    { name = "Het Waterschapshuis" },
    { name = "D2Hydro" },
    { name = "HKV" },
    { name = "HydroConsult" },
]
maintainers = [
    { name = "Philip Hansmann", email = "hydamo-validatietool@hetwaterschapshuis.nl" },
]
license = "MIT"
license-files = ["LICENSE"]

requires-python = ">=3.12,<3.13" # numpy/pandas/geo-stack in maart 2026 alleen stabiel met 3.12, later: proberen open te zetten
dependencies = [
	"fiona",
    "geopandas", 
    "pandas>=2",
    "pyogrio",
    "rasterio",
    "shapely>=2",
    "rasterstats",
    "tqdm",
    "jsonschema<4.23" # openzetten bij upgrade naar Python 3.13+, te nieuwe versie gaan mis tijdens deployment

]

dynamic = ["version"]

[project.scripts]
hydamo-validate = "hydamo_validation.__main__:main"

[project.optional-dependencies]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]"
]

# onderstaande zijn nodig voor de ontwikkelomgeving
dev = [
    "pytest",
    "pytest-cov",
	"ipykernel",
    "setuptools",
    "twine"
]

# onderstaande zijn nodig voor de dockeromgeving en bevatten modules voor de helper applicatie src/run.py
docker = [
    "pydantic",
	"fastapi>=0.115,<0.138",
    "firebase_admin",
	"aiofiles>=24,<25",
    "hydamo-validation==1.6.0"
]

[tool.flake8]
max-line-length = 120
max-complexity = 10

[tool.setuptools]
zip-safe = true

[tool.setuptools.dynamic]
version = { attr = "hydamo_validation.__version__" }

[tool.setuptools.packages.find]
include = ["hydamo_validation", "hydamo_validation.*"]

[tool.setuptools.package-data]
hydamo_validation = ["schemas/hydamo/*.json","schemas/rules/*.json", "styles/*.*"]

[project.urls]
Source = "https://github.com/HetWaterschapshuis/HyDAMOValidatieModule"
